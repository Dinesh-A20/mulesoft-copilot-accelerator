# Non-secret settings shared by every environment.
# Secrets (salesforce.secure.*, smtp.secure.*) are NEVER stored here; supply them as
# CloudHub 2.0 secure properties or -D runtime arguments.
app:
  name: "salesforce-account-email-notifier"

salesforce:
  jwt:
    keystorePath: "keystores/salesforce-jwt.jks"
    certificateAlias: "salesforce-jwt"
  timeout:
    readMs: "30000"
  reconnection:
    frequencyMs: "30000"
    attempts: "5"
  listener:
    pollFrequencySeconds: "60"

smtp:
  port: "587"
  timeout:
    connectMs: "10000"
    readMs: "30000"
    writeMs: "30000"
  retry:
    maxRetries: "3"
    millisBetweenRetries: "10000"

notification:
  dedupe:
    ttlDays: "30"
  replay:
    frequencyMinutes: "15"
