# local environment (non-secret values only). Replace placeholders before deploying.
salesforce:
  instanceUrl: "https://your-org.my.salesforce.com"
  jwt:
    principal: "integration.user@example.com"
    tokenEndpoint: "https://login.salesforce.com/services/oauth2/token"
    audienceUrl: "https://login.salesforce.com"

smtp:
  host: "smtp.office365.com"
  from: "mule-notifications@example.com"

notification:
  email:
    # Comma-separated list of recipients
    to: "your.name@example.com"
