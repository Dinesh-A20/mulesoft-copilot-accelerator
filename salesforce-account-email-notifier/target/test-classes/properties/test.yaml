salesforce:
  instanceUrl: "https://example-org.my.salesforce.com"
  secure:
    consumerKey: "test-consumer-key"
    keystorePassword: "test-keystore-password"
  jwt:
    principal: "integration.user@example.com"
    tokenEndpoint: "https://test.salesforce.com/services/oauth2/token"
