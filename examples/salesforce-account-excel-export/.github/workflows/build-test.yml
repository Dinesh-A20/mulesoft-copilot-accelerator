name: Build and test Mule application

on:
  pull_request:
    paths:
      - "examples/salesforce-account-excel-export/**"
  push:
    branches: [main]
    paths:
      - "examples/salesforce-account-excel-export/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-account-excel-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/salesforce-account-excel-export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Maven build and MUnit
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mule-test-reports-${{ github.sha }}
          path: |
            examples/salesforce-account-excel-export/target/surefire-reports/**
            examples/salesforce-account-excel-export/target/munit-reports/**
            examples/salesforce-account-excel-export/target/site/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-account-excel-export-${{ github.sha }}
          path: examples/salesforce-account-excel-export/target/*.jar
          if-no-files-found: error
          retention-days: 30

# Deployment is intentionally not automated in this workflow. Add protected,
# environment-specific promotion only after the deployment and security gates in
# docs/deployment.md have been approved.
