# DEP-05, ERR-07, NFR-02, FR-23: non-secret accelerator defaults.
application:
  name: "salesforce-pdf-api"
http:
  tls:
    alias: dummy
    keystore: dummy
  connector:
    version: dummy
  host: "0.0.0.0"
  port: "8082"
salesforce:
  connection-timeout: "5"
  read-timeout: "10"
  login-timeout: "5"
  pool-size: "10"
mq:
  success-queue: "account-pdf-generated"
  failure-queue: "account-pdf-failed"
  connection-timeout: "1000"
  client-timeout: "4000"
sap:
  enabled: "false"
# FR-30..35, ERR-30: shared ETL defaults; local activation overrides global defaults.
etl:
  schedule: "0 0 9 * * ?"
  timezone: "UTC"
  cutoff: "2026-11-25T00:00:00Z"
  batch-size: "200"
  retry-count: "2"
  retry-delay-ms: "30000"
  read-timeout: "60"
